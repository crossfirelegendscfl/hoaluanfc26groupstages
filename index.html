<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pick'Ems — Crossfire: Legends Fall Championship 2026</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="hero">
    <div class="hero-bg"></div>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <div class="breadcrumb">
        <span class="back-arrow">&#8249;</span>
        <span>Pick'Ems — Crossfire: Legends Fall Championship 2026</span>
      </div>
      <div class="hero-bottom-row">
        <h1 class="page-title">Lựa Chọn Của Tôi</h1>
        <button class="reset-btn" id="reset-btn" title="Xóa toàn bộ lựa chọn">Làm Lại</button>
      </div>
    </div>
  </header>

  <main>
    <p class="mode-hint">
      Kéo đội từ danh sách <strong>"Chưa Xếp Hạng"</strong> phía dưới lên các vị trí thứ hạng 1–4 phía trên để dự đoán kết quả vòng bảng.
      Khung <span class="hint-dot advance"></span><strong>vàng (hạng 1–2)</strong> là đội đi tiếp, khung <span class="hint-dot eliminated"></span><strong>xám (hạng 3–4)</strong> là đội bị loại.
    </p>

    <div class="groups-grid" id="groups-grid">
      <!-- Group cards injected by app.js -->
    </div>
  </main>

  <footer class="progress-footer">
    <div class="progress-footer-inner">
      <span class="progress-text" id="progress-text">0 / 16 lựa chọn đã hoàn thành</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="assets/teams.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
