<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pick'Ems — Crossfire: Legends Championship</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🎯</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <div class="breadcrumb">
        <span class="back-arrow">&#8249;</span>
        <span>Pick'Ems — Crossfire: Legends Championship</span>
      </div>
      <h1 class="page-title">Lựa Chọn Của Tôi</h1>
    </div>
    <div class="topbar-right">
      <div class="score-badge">
        <div class="score-value" id="total-score">0 đ</div>
        <div class="score-label">ĐIỂM SỐ</div>
      </div>
      <button class="reset-btn" id="reset-btn" title="Xóa toàn bộ lựa chọn">Làm Lại</button>
    </div>
  </header>

  <nav class="mode-tabs">
    <button class="mode-tab active" data-mode="predict">Dự Đoán Của Tôi</button>
    <button class="mode-tab" data-mode="actual">Nhập Kết Quả Thực Tế</button>
  </nav>

  <main>
    <div class="total-bar">
      <span class="total-bar-label">TỔNG: <strong id="total-score-2">0</strong> / <span id="total-max">160</span> đ</span>
      <div class="legend">
        <span class="legend-item"><span class="dot correct"></span> Chọn đúng</span>
        <span class="legend-item"><span class="dot partial"></span> Một Phần</span>
        <span class="legend-item"><span class="dot incorrect"></span> Không Chính Xác</span>
      </div>
    </div>

    <p class="mode-hint" id="mode-hint">
      Kéo đội từ danh sách "Chưa Xếp Hạng" vào "Bảng Xếp Hạng" theo đúng thứ tự bạn dự đoán đội đó sẽ về đích (hạng 1 trên cùng).
    </p>

    <div class="groups-grid" id="groups-grid">
      <!-- Group cards injected by app.js -->
    </div>
  </main>

  <footer class="progress-footer">
    <div class="progress-footer-inner">
      <span class="progress-text" id="progress-text">0 / 16 lựa chọn đã hoàn thành</span>
      <div class="progress-track">
        <div class="progress-fill" id="progress-fill" style="width:0%"></div>
      </div>
      <span class="progress-pct" id="progress-pct">0%</span>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
  <script src="assets/teams.js"></script>
  <script src="assets/scoring.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
